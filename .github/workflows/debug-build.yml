name: Android Develop Debug Build

on:
  workflow_dispatch: # Allows you to manually trigger this build from the Actions tab "as needed"
  push:
    branches: [ "develop" ] # Automatically builds a debug APK whenever you push to develop

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cygnus-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
