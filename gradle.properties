# --- Gradle Configuration ---
# Specifies the JVM arguments used for the Gradle Daemon.
# -Xmx2g: Increases the maximum heap size to 2GB.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Forces a stable JDK path to avoid toolchain conflicts with experimental IDE extensions.
org.gradle.java.home=C\:/Program Files/Amazon Corretto/jdk21.0.12_8

# Enables the Gradle Configuration Cache, which significantly speeds up builds by reusing the results of the configuration phase.
org.gradle.configuration-cache=true

# Disables "Configuration on Demand" as it is an incubating feature and is superseded by the Configuration Cache.
org.gradle.configureondemand=false

# Enables parallel execution of tasks across different subprojects.
org.gradle.parallel=true

# Enables parallel project synchronization in Android Studio for Gradle 9.4+.
org.gradle.tooling.parallel=true

# Controls how Gradle displays warnings. 'none' suppresses all warnings for a cleaner build log.
org.gradle.warning.mode=none

# --- Android Configuration ---
# When set to true, the Android plugin uses the appropriate AndroidX library instead of a Support Library.
android.useAndroidX=true

# When set to false, the Android plugin does not automatically convert third-party libraries to use AndroidX.
# Disabling Jetifier improves build performance.
android.enableJetifier=false

# Allows the use of Kotlin-style source sets (e.g., src/main/kotlin) alongside Java ones.
android.disallowKotlinSourceSets=false

# Suppresses warnings or errors when using a compileSdk version that is not yet fully supported by the AGP version.
android.suppressUnsupportedCompileSdk=36

# --- Toolchain Configuration ---
# Allows R8/Proguard to process code even if the target API level is higher than the toolchain's stable support.
com.android.tools.r8.allowUnsupportedApiLevel=true

testOptions.unitTests.includeAndroidResources=true
